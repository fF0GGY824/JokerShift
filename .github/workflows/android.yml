name: Build JokerShift APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JokerShiftProject для апк.zip'
      - 'JokerShift_DEVONE_1_PROFILE.zip'
      - 'JokerShift_SHOP_TOUCH_SCROLL_FIXED.zip'
      - 'JokerShift_ONLINE_BITO_TAKE_FIXED.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and unpack uploaded game
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP=""
          for candidate in "JokerShift_ONLINE_BITO_TAKE_FIXED.zip" "JokerShift_SHOP_TOUCH_SCROLL_FIXED.zip" "JokerShift_DEVONE_1_PROFILE.zip" "JokerShiftProject для апк.zip"; do
            if [ -s "$candidate" ]; then SOURCE_ZIP="$candidate"; break; fi
          done
          test -n "$SOURCE_ZIP" || { echo "ERROR: Upload JokerShift_DEVONE_1_PROFILE.zip or JokerShiftProject для апк.zip"; exit 1; }
          echo "Building APK from $SOURCE_ZIP"
          python3 - "$SOURCE_ZIP" <<'PY'
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile(sys.argv[1]) as z:
              if z.testzip() is not None:
                  raise SystemExit("The ZIP file is corrupted")
              names = z.namelist()
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path: " + name)
              files = set(names)
              for name in ["project.godot", "control.gd", "control.tscn", "export_presets.cfg", "tests/mobile_layout.gd"]:
                  if name not in files:
                      raise SystemExit("Missing: " + name)
              count = sum(n.startswith("assets/faces/") and n.endswith(".png") for n in names)
              if count != 55:
                  raise SystemExit("Expected 55 cards, found " + str(count))
              z.extractall("game")
              print("Verified JokerShift project, 55 cards.")
          PY

      - name: Make mobile viewport checks use simulated phone dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/control.gd")
          source = p.read_text(encoding="utf-8")
          old = "func adapt_layout() -> void:\n\tvar viewport_size: Vector2 = get_viewport_rect().size"
          new = (
              "func adapt_layout(viewport_override: Vector2 = Vector2.ZERO) -> void:\n"
              "\tvar viewport_size: Vector2 = (\n"
              "\t\tviewport_override if viewport_override.x > 0.0 and viewport_override.y > 0.0\n"
              "\t\telse get_viewport_rect().size\n"
              "\t)"
          )
          if source.count(old) == 1:
              p.write_text(source.replace(old, new), encoding="utf-8")
          elif source.count("func adapt_layout(viewport_override: Vector2 = Vector2.ZERO) -> void:") == 1:
              print("Mobile layout already updated; leaving source unchanged.")
          else:
              raise SystemExit("Unknown adapt_layout definition; check source")

          test_file = Path("game/tests/mobile_layout.gd")
          test = test_file.read_text(encoding="utf-8")
          needle = "\t\tgame.adapt_layout()"
          if test.count(needle) == 1:
              test_file.write_text(
                  test.replace(needle, "\t\tgame.adapt_layout(Vector2(screen))"),
                  encoding="utf-8"
              )
          elif test.count("\t\tgame.adapt_layout(Vector2(screen))") == 1:
              print("Mobile viewport test already updated.")
          else:
              raise SystemExit("Unknown mobile viewport test call")
          config = Path("game/project.godot")
          project = config.read_text(encoding="utf-8")
          setting = "textures/vram_compression/import_etc2_astc=true"
          if setting not in project:
              section = 'renderer/rendering_method.mobile="gl_compatibility"'
              if section not in project:
                  raise SystemExit("Cannot locate Godot rendering settings")
              project = project.replace(section, section + chr(10) + setting)
              config.write_text(project, encoding="utf-8")
          print("Android ETC2/ASTC texture compression enabled.")
          print("Mobile viewport simulations now pass explicit phone dimensions.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fL --retry 3 -o godot.zip "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "$BASE/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p /tmp/jokershift-templates
          unzip -q templates.tpz -d /tmp/jokershift-templates
          cp -a /tmp/jokershift-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --headless --version

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=JokerShift Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import game assets
        run: |
          cd game
          godot --headless --path . --editor --import

      - name: Check portrait layout
        run: |
          cd game
          godot --headless --path . --script res://tests/mobile_layout.gd

      - name: Export and validate APK
        run: |
          set -euo pipefail
          cd game
          mkdir -p build
          godot --headless --path . --export-debug Android build/JokerShift.apk
          test -s build/JokerShift.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/JokerShift.apk
          unzip -tq build/JokerShift.apk | tail -2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JokerShift-Android-APK
          path: game/build/JokerShift.apk
          if-no-files-found: error
          retention-days: 14
