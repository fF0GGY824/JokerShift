name: Export JokerShift current GitHub source ZIP
on:
  push:
    paths:
      - '.github/workflows/export-source-for-sync.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: JokerShift-Baseline-Archive
          path: JokerShift_DEVONE_1_PROFILE.zip
          if-no-files-found: error
          retention-days: 1
