# JokerShift multiplayer WebSocket server.
# Uses the newest easy-online archive when uploaded; otherwise the current
# JokerShiftProject archive already present in this repository.
services:
  - type: web
    name: jokershift-online-824
    runtime: python
    plan: free
    buildCommand: >-
      python -c 'import os,zipfile;
      p="JokerShift_EASY_ONLINE_RENDER_READY.zip";
      p=p if os.path.isfile(p) else "JokerShiftProject для апк.zip";
      zipfile.ZipFile(p).extractall("game")'
      && pip install -r game/online/server/requirements.txt
    startCommand: cd game/online/server && python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
