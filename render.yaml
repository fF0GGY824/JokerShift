# JokerShift multiplayer / Render
# Prefer the latest uploaded game ZIP. Until then use the previous online ZIP.
services:
  - type: web
    name: jokershift-online-824
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: |
      set -eu
      archive=""
      for candidate in JokerShift_ONLINE_BITO_TAKE_FIXED*.zip JokerShift_DEVONE_1_PROFILE*.zip JokerShift_DEV9999_5_PROFILES*.zip JokerShift_DEV9999_TWO_PROFILES*.zip JokerShift_DOUBLE_TRUMP_EQUAL_RANK*.zip JokerShift_EASY_ONLINE_RENDER_READY*.zip; do
        if [ -f "$candidate" ]; then
          archive="$candidate"
          break
        fi
      done
      if [ -z "$archive" ]; then
        echo "ERROR: Upload JokerShift_DEVONE_1_PROFILE.zip to GitHub first." >&2
        exit 1
      fi
      echo "Preparing JokerShift WebSocket server from $archive"
      python -m zipfile -e "$archive" .
      if ! grep -q 'finish_ready' online/server/game.py; then
        base64 -d patches/online_sync_2026_10_25.patch.gz.b64 | gzip -dc | patch --batch --fuzz=0 -p0
      fi
      grep -q 'finish_ready' online/server/game.py
      grep -q 'finish_ready' online/online_ui.gd
      test -s online/server/requirements.txt
      test -s online/server/server.py
      test -s online/server/game.py
      test -s online/server/social.py
      python -m py_compile online/server/server.py online/server/game.py online/server/social.py
      python -m pip install -r online/server/requirements.txt
    startCommand: cd online/server && python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEV_PROMO_PROFILE_LIMIT
        value: "5"
