# JokerShift WebSocket server on Render.
# Upload JokerShift_EASY_ONLINE_RENDER_READY.zip to the root of this GitHub
# repository. Render unpacks it automatically and runs the Python server.
services:
  - type: web
    name: jokershift-online-824
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: 'python -m zipfile -e JokerShift_EASY_ONLINE_RENDER_READY.zip game && pip install -r game/online/server/requirements.txt'
    startCommand: 'cd game/online/server && python server.py'
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
