# JokerShift WebSocket multiplayer server.
# Works with both the normal ZIP name and names like " (1).zip".
services:
  - type: web
    name: jokershift-online-824
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: |
      set -eu
      if [ ! -s online/server/requirements.txt ]; then
        set -- JokerShift_EASY_ONLINE_RENDER_READY*.zip
        if [ ! -f "$1" ]; then
          echo "ERROR: Upload JokerShift_EASY_ONLINE_RENDER_READY.zip to the root of GitHub." >&2
          exit 1
        fi
        echo "Extracting game server from: $1"
        python -m zipfile -e "$1" .
      fi
      test -s online/server/requirements.txt
      test -s online/server/server.py
      test -s online/server/game.py
      test -s online/server/social.py
      python -m pip install -r online/server/requirements.txt
    startCommand: cd online/server && python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
